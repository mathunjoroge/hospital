{% extends "patient_portal/layout.html" %}

{% block title %}Register | HIMS{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 540px; margin: 0 auto;">
  <div class="text-center mb-4">
    <h2 class="fw-bold text-white mb-1">Create Patient Account</h2>
    <p class="text-slate-400 small mb-0" style="color: #94a3b8;">Manage your health records online</p>
  </div>

  <form method="POST" action="{{ url_for('patient_portal.register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">

    <div class="mb-3">
      <label class="glass-label">National ID</label>
      <input type="text" name="national_id" required class="form-control glass-input-cyan" placeholder="e.g. 12345678">
    </div>

    <div class="mb-3">
      <label class="glass-label">Date of Birth</label>
      <input type="date" name="date_of_birth" required class="form-control glass-input-cyan">
    </div>

    <div class="mb-3">
      <label class="glass-label">Phone Number</label>
      <input type="tel" name="phone" required class="form-control glass-input-cyan" placeholder="+2547XXXXXXXX">
    </div>

    <div class="mb-3">
      <label class="glass-label">Email Address</label>
      <input type="email" name="email" required class="form-control glass-input-cyan" placeholder="you@example.com">
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <label class="glass-label">Password</label>
        <input type="password" name="password" required class="form-control glass-input-cyan" placeholder="••••••••">
      </div>
      <div class="col-md-6">
        <label class="glass-label">Confirm Password</label>
        <input type="password" name="confirm_password" required class="form-control glass-input-cyan" placeholder="••••••••">
      </div>
    </div>

    <button type="submit" class="btn btn-cyan-cta w-100 mb-3">
      <i class="bi bi-person-plus me-2"></i> Create Account
    </button>
  </form>

  <div class="mt-4 pt-3 border-top border-white border-opacity-10 text-center">
    <p class="small text-slate-400 mb-0" style="color: #94a3b8;">
      Already registered? <a href="{{ url_for('patient_portal.login') }}" class="text-info text-decoration-none fw-semibold">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
