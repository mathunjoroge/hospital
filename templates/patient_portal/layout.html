<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Patient Portal | HIMS{% endblock %}</title>
  <meta name="csrf-token" content="{{ csrf_token() if csrf_token is defined else '' }}">
  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
      --slate-bg: #0f172a;
      --slate-card: rgba(255, 255, 255, 0.05);
      --slate-border: rgba(255, 255, 255, 0.12);
      --cyan-accent: #06b6d4;
    }

    body {
      background-color: var(--slate-bg);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Glowing Orbs */
    .orb-cyan-1 {
      position: absolute;
      top: 15%;
      right: 20%;
      width: 380px;
      height: 380px;
      background: rgba(6, 182, 212, 0.18);
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .orb-cyan-2 {
      position: absolute;
      bottom: 10%;
      left: 15%;
      width: 350px;
      height: 350px;
      background: rgba(14, 165, 233, 0.12);
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    /* Glassmorphism Card */
    .glass-card {
      background: var(--slate-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--slate-border);
      border-radius: 1.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      padding: 2.5rem;
      position: relative;
      z-index: 10;
    }

    /* Custom Form Controls */
    .glass-input-cyan {
      background-color: rgba(30, 41, 59, 0.6) !important;
      border: 1px solid #334155 !important;
      color: #ffffff !important;
      padding: 0.75rem 1rem;
      border-radius: 0.6rem;
      transition: all 0.2s ease;
    }

    .glass-input-cyan::placeholder {
      color: #64748b !important;
    }

    .glass-input-cyan:focus {
      background-color: rgba(30, 41, 59, 0.85) !important;
      border-color: #06b6d4 !important;
      box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.25) !important;
      color: #ffffff !important;
    }

    .glass-label {
      color: #cbd5e1;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.375rem;
      display: block;
    }

    .btn-cyan-cta {
      background-color: #0891b2;
      border: none;
      color: #ffffff;
      font-weight: 600;
      padding: 0.75rem 1.25rem;
      border-radius: 0.6rem;
      box-shadow: 0 10px 20px -5px rgba(8, 145, 178, 0.4);
      transition: all 0.2s ease;
    }

    .btn-cyan-cta:hover {
      background-color: #0e7490;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -5px rgba(8, 145, 178, 0.5);
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">
  <div class="orb-cyan-1"></div>
  <div class="orb-cyan-2"></div>

  <div class="container" style="max-width: 480px; position: relative; z-index: 10;">
    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'danger' if category in ['error', 'danger'] else category }} alert-dismissible fade show border-0 text-white shadow-lg mb-4" style="background: rgba(14, 116, 144, 0.9); backdrop-filter: blur(10px);" role="alert">
            <i class="bi bi-info-circle-fill me-2"></i> {{ message }}
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
