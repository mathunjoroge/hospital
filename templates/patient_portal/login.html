{% extends "patient_portal/layout.html" %}

{% block title %}Patient Login | HIMS{% endblock %}

{% block content %}
<div class="glass-card">
  <div class="text-center mb-4">
    <div class="d-inline-flex align-items-center justify-content-center bg-info bg-opacity-25 rounded-circle p-3 mb-3" style="width: 64px; height: 64px;">
      <i class="bi bi-person-heart text-info fs-2"></i>
    </div>
    <h2 class="fw-bold text-white mb-1">Patient Portal</h2>
    <p class="text-slate-400 small mb-0" style="color: #94a3b8;">Access your medical records online</p>
  </div>

  <form method="POST" action="{{ url_for('patient_portal.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">

    <div class="mb-3">
      <label for="username" class="glass-label">Username</label>
      <input type="text" name="username" id="username" required class="form-control glass-input-cyan" placeholder="Enter your username">
    </div>

    <div class="mb-4">
      <label for="password" class="glass-label">Password</label>
      <input type="password" name="password" id="password" required class="form-control glass-input-cyan" placeholder="••••••••">
    </div>

    <button type="submit" class="btn btn-cyan-cta w-100 mb-3">
      <i class="bi bi-shield-lock me-2"></i> Access Portal
    </button>
  </form>

  <div class="mt-4 pt-3 border-top border-white border-opacity-10 text-center">
    <p class="small text-slate-400 mb-2" style="color: #94a3b8;">
      Don't have an account? <a href="{{ url_for('patient_portal.register') }}" class="text-info text-decoration-none fw-semibold">Register here</a>
    </p>
    <p class="small text-slate-400 mb-0" style="color: #94a3b8;">
      Staff member? <a href="{{ url_for('login') }}" class="text-primary-subtle text-decoration-none fw-semibold">Staff Login</a>
    </p>
  </div>
</div>
{% endblock %}
