<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MFA Verification - HMIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow" style="width: 380px;">
        <h4 class="card-title text-center mb-3">Two-Factor Authentication</h4>
        <p class="text-muted text-center small">Enter the 6-digit code from your authenticator app for <strong>{{ username }}</strong>.</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ 'danger' if category == 'error' else category }} p-2 small text-center">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-3">
                <input type="text" name="code" class="form-control text-center fs-4 tracking-widest" placeholder="123456" maxlength="6" autofocus required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Verify Code</button>
        </form>
    </div>
</body>
</html>
