{% extends "base.html" %}

{% block title %}Referral & Discharge Handover{% endblock %}

{% block content %}
<!-- Load Alpine.js for reactivity -->
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

<div class="container-fluid" x-data="referralApp()">
    <div class="row mb-4">
        <div class="col">
            <h1 class="h3 mb-0">
                <i class="bi bi-arrow-left-right text-indigo me-2"></i>
                Referral & Discharge Handover
            </h1>
            <p class="text-muted mt-1">Continuity of Care Management</p>
        </div>
    </div>

    <!-- Tab Navigation -->
    <ul class="nav nav-pills mb-4">
        <li class="nav-item">
            <button class="nav-link" :class="tab==='ref'?'active':''" @click="tab='ref'">
                <i class="bi bi-hospital me-2"></i> Referrals
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" :class="tab==='dis'?'active':''" @click="tab='dis'">
                <i class="bi bi-box-arrow-right me-2"></i> Discharge
            </button>
        </li>
    </ul>

    <!-- Referrals Tab -->
    <div x-show="tab==='ref'">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-bottom">
                        <h5 class="mb-0">
                            <i class="bi bi-hospital me-2"></i>
                            Initiate Inter-Facility Referral
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Patient ID</label>
                            <input type="number" x-model="patientId" class="form-control" placeholder="Enter Patient ID">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Receiving Facility</label>
                            <select x-model="receiving" class="form-select">
                                <option value="">Select Receiving Facility...</option>
                                <option>Level 3 - Health Centre</option>
                                <option>Level 4 - Sub-County</option>
                                <option>Level 5 - County Referral</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Reason for Referral</label>
                            <textarea x-model="reason" class="form-control" rows="3" placeholder="Clinical reason for referral..."></textarea>
                        </div>
                        <button @click="initiate" class="btn btn-indigo w-100" style="background-color: #6366f1; color: white;">
                            <i class="bi bi-send me-2"></i> Initiate Referral
                        </button>
                        <div x-show="msg" class="alert alert-success mt-3 mb-0">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            <span x-text="msg"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Discharge Tab -->
    <div x-show="tab==='dis'">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-bottom">
                        <h5 class="mb-0">
                            <i class="bi bi-box-arrow-right me-2"></i>
                            Generate Discharge Summary
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Patient ID</label>
                            <input type="number" x-model="patientId" class="form-control" placeholder="Enter Patient ID">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Primary Diagnosis</label>
                            <input type="text" x-model="diagnosis" class="form-control" placeholder="e.g., Community Acquired Pneumonia">
                        </div>
                        <button @click="discharge" class="btn btn-teal w-100" style="background-color: #14b8a6; color: white;">
                            <i class="bi bi-file-earmark-text me-2"></i> Generate Summary
                        </button>
                        <div x-show="msg" class="alert alert-success mt-3 mb-0">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            <span x-text="msg"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function referralApp() {
    return {
        tab: 'ref',
        patientId: '',
        receiving: '',
        reason: '',
        diagnosis: '',
        msg: '',
        
        async initiate() {
            if(!this.patientId || !this.receiving || !this.reason) {
                alert('Please fill all fields');
                return;
            }
            try {
                const r = await fetch('/referrals/api/initiate', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({
                        patient_id: parseInt(this.patientId),
                        referring_facility: 'Current',
                        receiving_facility: this.receiving,
                        reason: this.reason,
                        clinical_summary: this.reason
                    })
                });
                const d = await r.json();
                if(r.ok) {
                    this.msg = 'Referral initiated: ' + d.referral_id;
                } else {
                    alert('Failed to initiate referral');
                }
            } catch (e) {
                console.error('Referral initiation failed:', e);
                alert('Failed to initiate referral');
            }
        },
        
        async discharge() {
            if(!this.patientId || !this.diagnosis) {
                alert('Please fill all fields');
                return;
            }
            try {
                const r = await fetch('/referrals/api/discharge', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({
                        patient_id: parseInt(this.patientId),
                        primary_diagnosis: this.diagnosis,
                        admission_date: new Date().toISOString().split('T')[0]
                    })
                });
                const d = await r.json();
                if(r.ok) {
                    this.msg = 'Summary generated: ' + d.summary_id;
                } else {
                    alert('Failed to generate discharge summary');
                }
            } catch (e) {
                console.error('Discharge failed:', e);
                alert('Failed to generate discharge summary');
            }
        }
    }
}
</script>
{% endblock %}
