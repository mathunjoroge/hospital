{% extends "base.html" %}
{% block title %}MCH & Immunization Workbench{% endblock %}
{% block content %}
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<div class="max-w-6xl mx-auto px-4 py-6" x-data="mchApp()">
    <div class="flex space-x-1 bg-gray-200 p-1 rounded-lg mb-6 max-w-md">
        <button @click="activeTab = 'immunization'" :class="activeTab === 'immunization' ? 'bg-white shadow text-gray-900' : 'text-gray-500'" class="flex-1 py-2 px-4 rounded-md text-sm font-medium">Immunization</button>
        <button @click="activeTab = 'anc'" :class="activeTab === 'anc' ? 'bg-white shadow text-gray-900' : 'text-gray-500'" class="flex-1 py-2 px-4 rounded-md text-sm font-medium">ANC Visits</button>
    </div>
    <div x-show="activeTab === 'immunization'" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-1 rounded-xl shadow-sm border p-6" style="background-color: var(--card-bg); border-color: #e2e8f0;">
            <h2 class="text-sm font-semibold uppercase mb-4" style="color: #64748b;">Child Lookup</h2>
            <input type="number" x-model="childId" placeholder="Child Patient ID" class="w-full rounded-lg border p-2.5 text-sm mb-3" style="background-color: var(--content-bg); color: var(--text-color); border-color: #cbd5e1;">
            <input type="number" x-model="childAgeWeeks" placeholder="Age in Weeks" class="w-full rounded-lg border p-2.5 text-sm mb-3" style="background-color: var(--content-bg); color: var(--text-color); border-color: #cbd5e1;">
            <button @click="fetchSchedule" class="w-full py-2.5 px-4 bg-pink-600 text-white rounded-lg text-sm font-medium">Load Schedule</button>
            <div class="mt-4 space-y-2" x-show="dueVaccines.length > 0">
                <template x-for="v in dueVaccines" :key="v.vaccine_name + v.dose_number">
                    <div class="p-2 rounded border text-sm" :class="v.status === 'OVERDUE' ? 'bg-red-50 border-red-200' : 'bg-blue-50 border-blue-200'">
                        <span class="font-bold" x-text="v.vaccine_name + ' (Dose ' + v.dose_number + ')'"></span>
                        <span class="text-xs ml-2" x-text="v.status"></span>
                    </div>
                </template>
            </div>
        </div>
        <div class="lg:col-span-2 rounded-xl shadow-sm border p-6" style="background-color: var(--card-bg); border-color: #e2e8f0;">
            <h2 class="text-lg font-bold mb-4" style="color: var(--text-color);">Record Immunization</h2>
            <select x-model="selectedVaccine" class="w-full rounded-lg border p-2.5 text-sm mb-3" style="background-color: var(--content-bg); color: var(--text-color); border-color: #cbd5e1;">
                <option value="">Select vaccine...</option><option>BCG</option><option>OPV</option><option>Pentavalent</option><option>PCV</option><option>Measles-Rubella</option>
            </select>
            <input type="number" x-model="doseNumber" placeholder="Dose Number" class="w-full rounded-lg border p-2.5 text-sm mb-3" style="background-color: var(--content-bg); color: var(--text-color); border-color: #cbd5e1;">
            <button @click="recordImmunization" class="px-6 py-2.5 bg-pink-600 text-white rounded-lg text-sm font-medium">Record Vaccination</button>
            <div x-show="successMessage" class="mt-3 p-3 rounded bg-green-50 text-green-700 text-sm" x-text="successMessage"></div>
        </div>
    </div>
    <div x-show="activeTab === 'anc'" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="rounded-xl shadow-sm border p-6" style="background-color: var(--card-bg); border-color: #e2e8f0;">
            <h2 class="text-lg font-bold mb-4" style="color: var(--text-color);">Log ANC Visit</h2>
            <input type="number" x-model="ancPatientId" placeholder="Patient ID" class="w-full rounded-lg border p-2.5 text-sm mb-3" style="background-color: var(--content-bg); color: var(--text-color); border-color: #cbd5e1;">
            <input type="number" x-model="ancGestationWeeks" placeholder="Gestation Weeks" class="w-full rounded-lg border p-2.5 text-sm mb-3" style="background-color: var(--content-bg); color: var(--text-color); border-color: #cbd5e1;">
            <button @click="logAncVisit" class="w-full py-2.5 px-4 bg-purple-600 text-white rounded-lg text-sm font-medium">Log Visit</button>
            <div x-show="ancSuccess" class="mt-3 p-3 rounded bg-green-50 text-green-700 text-sm" x-text="ancSuccess"></div>
        </div>
    </div>
</div>
<script>
function mchApp() {
    return {
        activeTab: 'immunization', childId: '', childAgeWeeks: '', dueVaccines: [], selectedVaccine: '', doseNumber: 1, successMessage: '', ancPatientId: '', ancGestationWeeks: '', ancSuccess: '',
        async fetchSchedule() {
            if(!this.childId||!this.childAgeWeeks) return;
            const r = await fetch(`/mch/api/child/${this.childId}/schedule?age_weeks=${this.childAgeWeeks}`); const d = await r.json(); this.dueVaccines = d.vaccines||[];
        },
        async recordImmunization() {
            const r = await fetch('/mch/api/immunize', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({child_patient_id:parseInt(this.childId), vaccine_name:this.selectedVaccine, dose_number:parseInt(this.doseNumber)})});
            const d = await r.json(); if(r.ok) { this.successMessage = "Recorded!"; this.fetchSchedule(); }
        },
        async logAncVisit() {
            const r = await fetch('/mch/api/anc-visit', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({patient_id:parseInt(this.ancPatientId), visit_number:1, gestation_weeks:parseInt(this.ancGestationWeeks)})});
            const d = await r.json(); if(r.ok) this.ancSuccess = "Logged! Next: " + d.next_appointment_date;
        }
    }
}
</script>
{% endblock %}
