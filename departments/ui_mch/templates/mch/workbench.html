{% extends "base.html" %}

{% block title %}MCH & Immunization Workbench{% endblock %}

{% block content %}
<!-- Load Alpine.js for reactivity -->
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

<div class="container-fluid" x-data="mchApp()">
    <div class="row mb-4">
        <div class="col">
            <h1 class="h3 mb-0">
                <i class="bi bi-heart-pulse text-pink me-2"></i>
                MCH & Immunization Workbench
            </h1>
            <p class="text-muted mt-1">Maternal & Child Health Management</p>
        </div>
    </div>

    <!-- Tab Navigation -->
    <ul class="nav nav-pills mb-4">
        <li class="nav-item">
            <button class="nav-link" :class="activeTab === 'immunization' ? 'active' : ''" @click="activeTab = 'immunization'">
                <i class="bi bi-droplet me-2"></i> Immunization
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" :class="activeTab === 'anc' ? 'active' : ''" @click="activeTab = 'anc'">
                <i class="bi bi-person-hearts me-2"></i> ANC Visits
            </button>
        </li>
    </ul>

    <!-- Immunization Tab -->
    <div x-show="activeTab === 'immunization'">
        <div class="row g-4">
            <!-- Child Lookup -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-bottom">
                        <h5 class="mb-0">
                            <i class="bi bi-search me-2"></i>
                            Child Lookup
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Child Patient ID</label>
                            <input type="number" x-model="childId" class="form-control" placeholder="Enter Child ID">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Age in Weeks</label>
                            <input type="number" x-model="childAgeWeeks" class="form-control" placeholder="e.g., 24">
                        </div>
                        <button @click="fetchSchedule" class="btn btn-pink w-100" style="background-color: #ec4899; color: white;">
                            <i class="bi bi-calendar-check me-2"></i> Load Schedule
                        </button>

                        <!-- Due Vaccines -->
                        <div x-show="dueVaccines.length > 0" class="mt-4">
                            <h6 class="fw-semibold mb-3">Due Vaccines</h6>
                            <template x-for="v in dueVaccines" :key="v.vaccine_name + v.dose_number">
                                <div class="alert mb-2 py-2 px-3" :class="v.status === 'OVERDUE' ? 'alert-danger' : 'alert-info'">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <strong x-text="v.vaccine_name + ' (Dose ' + v.dose_number + ')'"></strong>
                                        <span class="badge" :class="v.status === 'OVERDUE' ? 'bg-danger' : 'bg-info'" x-text="v.status"></span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Record Immunization -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-bottom">
                        <h5 class="mb-0">
                            <i class="bi bi-pencil-square me-2"></i>
                            Record Immunization
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Vaccine</label>
                                <select x-model="selectedVaccine" class="form-select">
                                    <option value="">Select vaccine...</option>
                                    <option>BCG</option>
                                    <option>OPV</option>
                                    <option>Pentavalent</option>
                                    <option>PCV</option>
                                    <option>Measles-Rubella</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Dose Number</label>
                                <input type="number" x-model="doseNumber" class="form-control" placeholder="1">
                            </div>
                        </div>
                        <button @click="recordImmunization" class="btn btn-pink mt-3" style="background-color: #ec4899; color: white;">
                            <i class="bi bi-check-circle me-2"></i> Record Vaccination
                        </button>
                        <div x-show="successMessage" class="alert alert-success mt-3 mb-0">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            <span x-text="successMessage"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ANC Tab -->
    <div x-show="activeTab === 'anc'">
        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-bottom">
                        <h5 class="mb-0">
                            <i class="bi bi-person-hearts me-2"></i>
                            Log ANC Visit
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Patient ID</label>
                            <input type="number" x-model="ancPatientId" class="form-control" placeholder="Enter Patient ID">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Gestation Weeks</label>
                            <input type="number" x-model="ancGestationWeeks" class="form-control" placeholder="e.g., 20">
                        </div>
                        <button @click="logAncVisit" class="btn btn-purple w-100" style="background-color: #a855f7; color: white;">
                            <i class="bi bi-calendar-plus me-2"></i> Log Visit
                        </button>
                        <div x-show="ancSuccess" class="alert alert-success mt-3 mb-0">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            <span x-text="ancSuccess"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function mchApp() {
    return {
        activeTab: 'immunization',
        childId: '',
        childAgeWeeks: '',
        dueVaccines: [],
        selectedVaccine: '',
        doseNumber: 1,
        successMessage: '',
        ancPatientId: '',
        ancGestationWeeks: '',
        ancSuccess: '',
        
        async fetchSchedule() {
            if(!this.childId || !this.childAgeWeeks) {
                alert('Please enter Child ID and Age');
                return;
            }
            try {
                const r = await fetch(`/mch/api/child/${this.childId}/schedule?age_weeks=${this.childAgeWeeks}`);
                const d = await r.json();
                this.dueVaccines = d.vaccines || [];
            } catch (e) {
                console.error('Failed to fetch schedule:', e);
                alert('Failed to load immunization schedule');
            }
        },
        
        async recordImmunization() {
            if(!this.selectedVaccine) {
                alert('Please select a vaccine');
                return;
            }
            try {
                const r = await fetch('/mch/api/immunize', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({
                        child_patient_id: parseInt(this.childId),
                        vaccine_name: this.selectedVaccine,
                        dose_number: parseInt(this.doseNumber)
                    })
                });
                const d = await r.json();
                if(r.ok) {
                    this.successMessage = "Immunization recorded successfully!";
                    this.fetchSchedule();
                } else {
                    alert('Failed to record immunization');
                }
            } catch (e) {
                console.error('Failed to record immunization:', e);
                alert('Failed to record immunization');
            }
        },
        
        async logAncVisit() {
            if(!this.ancPatientId || !this.ancGestationWeeks) {
                alert('Please enter Patient ID and Gestation Weeks');
                return;
            }
            try {
                const r = await fetch('/mch/api/anc-visit', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({
                        patient_id: parseInt(this.ancPatientId),
                        visit_number: 1,
                        gestation_weeks: parseInt(this.ancGestationWeeks)
                    })
                });
                const d = await r.json();
                if(r.ok) {
                    this.ancSuccess = "Visit logged! Next appointment: " + d.next_appointment_date;
                } else {
                    alert('Failed to log ANC visit');
                }
            } catch (e) {
                console.error('Failed to log ANC visit:', e);
                alert('Failed to log ANC visit');
            }
        }
    }
}
</script>
{% endblock %}
