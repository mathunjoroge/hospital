{% extends "base.html" %}
{% block title %}Revenue Cycle & Claims Scrubber{% endblock %}
{% block content %}
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<div class="max-w-4xl mx-auto px-4 py-6" x-data="billingApp()">
    <div class="rounded-xl shadow-sm border p-6" style="background-color: var(--card-bg); border-color: #e2e8f0;">
        <h2 class="text-xl font-bold mb-6" style="color: var(--text-color);">SHA/Insurance Claim Scrubber</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <input type="number" x-model="patientId" placeholder="Patient ID" class="w-full rounded-lg border p-2.5 text-sm" style="background-color: var(--content-bg); color: var(--text-color); border-color: #cbd5e1;">
            <input type="number" x-model="amount" placeholder="Billed Amount" class="w-full rounded-lg border p-2.5 text-sm" style="background-color: var(--content-bg); color: var(--text-color); border-color: #cbd5e1;">
            <input type="date" x-model="startDate" class="w-full rounded-lg border p-2.5 text-sm" style="background-color: var(--content-bg); color: var(--text-color); border-color: #cbd5e1;">
            <input type="date" x-model="endDate" class="w-full rounded-lg border p-2.5 text-sm" style="background-color: var(--content-bg); color: var(--text-color); border-color: #cbd5e1;">
            <input type="text" x-model="icd10" placeholder="Primary Diagnosis (ICD-10)" class="md:col-span-2 w-full rounded-lg border p-2.5 text-sm" style="background-color: var(--content-bg); color: var(--text-color); border-color: #cbd5e1;">
        </div>
        <button @click="scrubClaim" class="w-full py-2.5 px-4 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700">Scrub Claim Before Submission</button>
        
        <div x-show="scrubResult !== null" class="mt-6">
            <div x-show="scrubResult.is_clean" class="p-4 rounded-lg bg-green-50 border border-green-200 text-green-800">
                <h3 class="font-bold">✅ Claim is Clean</h3>
                <p class="text-sm mt-1">Ready for submission to SHA/Insurance.</p>
            </div>
            <div x-show="!scrubResult.is_clean" class="p-4 rounded-lg bg-red-50 border border-red-200 text-red-800">
                <h3 class="font-bold">❌ Claim Rejected by Scrubber</h3>
                <ul class="list-disc pl-5 mt-2 text-sm">
                    <template x-for="err in scrubResult.errors" :key="err"><li x-text="err"></li></template>
                </ul>
            </div>
        </div>
    </div>
</div>
<script>
function billingApp() {
    return {
        patientId: '', amount: '', startDate: '', endDate: '', icd10: '', scrubResult: null,
        async scrubClaim() {
            const r = await fetch('/rcm/api/claim/scrub', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({patient_id:parseInt(this.patientId), billed_amount:parseFloat(this.amount), service_start_date:this.startDate, service_end_date:this.endDate, primary_diagnosis_icd10:this.icd10})});
            this.scrubResult = await r.json();
        }
    }
}
</script>
{% endblock %}
