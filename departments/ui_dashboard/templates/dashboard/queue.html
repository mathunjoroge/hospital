{% extends "base.html" %}

{% block title %}Live Queue Dashboard{% endblock %}

{% block content %}
<!-- Load Tailwind just for this specific dashboard component -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@1.9.10"></script>

<div class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
        <div>
            <h1 class="text-3xl font-bold" style="color: var(--text-color);">Outpatient Flow Dashboard</h1>
            <p class="mt-1" style="color: #64748b;">Provider ID: <span id="provider-display" class="font-semibold text-blue-600"></span></p>
        </div>
        <button onclick="window.location.reload()" class="px-4 py-2 border rounded-lg text-sm font-medium shadow-sm transition" style="background-color: var(--card-bg); color: var(--text-color); border-color: #e2e8f0;">
            <i class="bi bi-arrow-clockwise me-2"></i> Refresh
        </button>
    </div>

    <!-- Stats Row -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="rounded-xl shadow-sm border p-6 flex items-center justify-between" style="background-color: var(--card-bg); border-color: #e2e8f0;">
            <div>
                <p class="text-sm font-medium" style="color: #64748b;">Total Scheduled Today</p>
                <p id="stat-total" class="text-3xl font-bold mt-1" style="color: var(--text-color);">--</p>
            </div>
            <div class="p-3 bg-blue-50 rounded-full text-blue-600">
                <i class="bi bi-calendar3 text-2xl"></i>
            </div>
        </div>
        <div class="rounded-xl shadow-sm border p-6 flex items-center justify-between" style="background-color: var(--card-bg); border-color: #e2e8f0;">
            <div>
                <p class="text-sm font-medium" style="color: #64748b;">Waiting in Queue</p>
                <p id="stat-waiting" class="text-3xl font-bold mt-1 text-amber-500">--</p>
            </div>
            <div class="p-3 bg-amber-50 rounded-full text-amber-500">
                <i class="bi bi-hourglass-split text-2xl"></i>
            </div>
        </div>
        <div class="rounded-xl shadow-sm border p-6 flex items-center justify-between" style="background-color: var(--card-bg); border-color: #e2e8f0;">
            <div>
                <p class="text-sm font-medium" style="color: #64748b;">In Consultation</p>
                <p id="stat-in-progress" class="text-3xl font-bold mt-1 text-green-600">--</p>
            </div>
            <div class="p-3 bg-green-50 rounded-full text-green-600">
                <i class="bi bi-clipboard2-pulse text-2xl"></i>
            </div>
        </div>
    </div>

    <!-- Live Queue Table -->
    <div class="rounded-xl shadow-sm border overflow-hidden" style="background-color: var(--card-bg); border-color: #e2e8f0;">
        <div class="px-6 py-4 border-b flex justify-between items-center" style="border-color: #e2e8f0;">
            <h2 class="text-lg font-semibold" style="color: var(--text-color);">Live Waiting Room Queue</h2>
            <span class="flex items-center text-xs font-medium text-green-600 bg-green-50 px-2.5 py-1 rounded-full">
                <span class="w-2 h-2 bg-green-500 rounded-full mr-1.5 animate-pulse"></span>
                Auto-refreshing
            </span>
        </div>
        
        <div id="queue-container" 
             hx-get="/appointments/api/queue/1" 
             hx-trigger="load, every 5s"
             hx-swap="innerHTML"
             class="p-4">
            <div class="text-center py-8" style="color: #64748b;">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Connecting to live queue...</p>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const pathParts = window.location.pathname.split('/');
        const providerId = pathParts[pathParts.length - 1];
        document.getElementById('provider-display').textContent = providerId;
        
        const queueContainer = document.getElementById('queue-container');
        queueContainer.setAttribute('hx-get', `/appointments/api/queue/${providerId}`);
        htmx.process(queueContainer);
    });
</script>
{% endblock %}
