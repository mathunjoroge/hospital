{% extends "patient_portal/layout.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 3rem auto;">
    <div class="card">
        <h2 style="margin-top: 0; margin-bottom: 0.25rem;">Forgot Your Password?</h2>
        <p style="color: var(--text-muted); margin-top: 0.25rem; margin-bottom: 1.5rem;">
            Enter your portal username and we'll send a password reset link to your registered email address.
        </p>

        <form action="{{ url_for('patient_portal.forgot_password') }}" method="POST">
            <div class="form-group">
                <label for="username">Portal Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    required
                    autofocus
                >
            </div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">
                Send Reset Link
            </button>
        </form>

        <hr style="border-color: var(--border); margin: 1.5rem 0;">
        <p style="text-align: center; color: var(--text-muted); margin: 0;">
            Remembered your password?
            <a href="{{ url_for('patient_portal.login') }}" style="color: var(--primary);">Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
