{% extends "patient_portal/layout.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 3rem auto;">
    <div class="card">
        <h2 style="margin-top: 0; margin-bottom: 0.25rem;">Set a New Password</h2>
        <p style="color: var(--text-muted); margin-top: 0.25rem; margin-bottom: 1.5rem;">
            Choose a strong password — at least 8 characters.
        </p>

        <form action="{{ url_for('patient_portal.reset_password', token=token) }}" method="POST">
            <div class="form-group">
                <label for="password">New Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Minimum 8 characters"
                    minlength="8"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Re-enter new password"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">
                Reset Password
            </button>
        </form>

        <hr style="border-color: var(--border); margin: 1.5rem 0;">
        <p style="text-align: center; color: var(--text-muted); margin: 0;">
            <a href="{{ url_for('patient_portal.login') }}" style="color: var(--primary);">Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
