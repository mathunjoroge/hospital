{% extends "patient_portal/layout.html" %}

{% block title %}Patient Login{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 3rem auto;">
    <div class="card">
        <h2>Patient Portal Login</h2>
        <p style="color: var(--text-muted);">Access your verified medical records, lab results, and appointments.</p>

        <form action="{{ url_for('patient_portal.login') }}" method="POST">
            <div class="form-group">
                <label for="username">Portal Username</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Log In</button>
            <div style="margin-top: 0.75rem; text-align: right;">
                <a href="{{ url_for('patient_portal.forgot_password') }}" style="color: var(--primary); font-size: 0.875rem;">Forgot Password?</a>
            </div>
        </form>

        <hr style="border-color: var(--border); margin: 1.5rem 0;">
        <p style="text-align: center; color: var(--text-muted);">
            Don't have a portal account yet? <a href="{{ url_for('patient_portal.register') }}" style="color: var(--primary);">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
