[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["unsloth", "venv", ".git"]
addopts = "--cov=departments --cov=app --cov-fail-under=45"

[tool.ruff]
exclude = ["venv", "migrations", "unsloth"]

[tool.ruff.lint.per-file-ignores]
# Late imports are intentional — depend on app/db/blueprint objects being
# initialised before the import runs (Flask blueprint pattern, post-db.init_app()
# hooks, sys.path manipulation, env-var guards, etc.)
"app.py" = ["E402"]
"celery_app.py" = ["E402"]
"departments/admin/__init__.py" = ["E402"]
"departments/analytics/__init__.py" = ["E402"]
"departments/api/__init__.py" = ["E402"]
"departments/api/auth.py" = ["E402"]
"departments/appointments/__init__.py" = ["E402"]
"departments/billing/__init__.py" = ["E402"]
"departments/clinical_safety/__init__.py" = ["E402"]
"departments/consent/__init__.py" = ["E402"]
"departments/emergency/__init__.py" = ["E402"]
"departments/hr/__init__.py" = ["E402"]
"departments/imaging/__init__.py" = ["E402"]
"departments/laboratory/__init__.py" = ["E402"]
"departments/mch/__init__.py" = ["E402"]
"departments/medicine/__init__.py" = ["E402"]
"departments/medicine/orders.py" = ["E402"]
"departments/mortuary/__init__.py" = ["E402"]
"departments/nursing/__init__.py" = ["E402"]
"departments/patient_portal/__init__.py" = ["E402"]
"departments/pharmacy/__init__.py" = ["E402"]
"departments/rcm/__init__.py" = ["E402"]
"departments/records/__init__.py" = ["E402"]
"departments/referrals/__init__.py" = ["E402"]
"departments/stores/__init__.py" = ["E402"]
"departments/telemedicine/__init__.py" = ["E402"]
"departments/ui_billing/__init__.py" = ["E402"]
"departments/ui_clinical/__init__.py" = ["E402"]
"departments/ui_dashboard/__init__.py" = ["E402"]
"departments/ui_mch/__init__.py" = ["E402"]
"departments/ui_referrals/__init__.py" = ["E402"]
"scripts/load_test_baseline.py" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app", "config", "extensions", "departments"]
known-third-party = [
    "dotenv", "flask", "flask_apscheduler", "flask_login", "flask_mail",
    "flask_migrate", "flask_session", "markupsafe", "pyotp", "redis",
    "sqlalchemy", "werkzeug", "pydicom",
]
