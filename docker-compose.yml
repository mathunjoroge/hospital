services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hospital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-hospital_core}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospital}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-changeme} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Flask HMIS app ───────────────────────────────────────────────────────────
  flask:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
      SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER:-hospital}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hospital_core}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/Uploads
      - flask_session:/app/flask_session
      - backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── FastAPI NLP service ──────────────────────────────────────────────────────
  nlp:
    build:
      context: .
      dockerfile: Dockerfile.nlp
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Celery Task Worker ───────────────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A celery_app.celery worker --loglevel=info
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
      SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER:-hospital}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hospital_core}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Mirth Connect — HL7v2 MLLP Interface Engine (Phase 4) ───────────────────
  # P4-01 Decision: Mirth Connect (free, self-hosted). See DECISIONS_PENDING.md §16.
  mirth_connect:
    image: nextgenhealthcare/connect:4.4.2
    restart: unless-stopped
    environment:
      DATABASE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hospital_core}
      DATABASE_USERNAME: ${POSTGRES_USER:-hospital}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      KEYSTORE_STOREPASS: ${MIRTH_KEYSTORE_PASS:-changeme}
      KEYSTORE_KEYPASS: ${MIRTH_KEYSTORE_PASS:-changeme}
    ports:
      - "8080:8080"    # Mirth Connect Administrator (HTTPS on 8443 in prod)
      - "2575:2575"    # MLLP receiver port (standard)
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mirth_data:/opt/connect/appdata
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/server/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── MLLP Daemon — asyncio fallback listener (Phase 4) ────────────────────────
  # Runs when Mirth is unavailable or for direct analyzer connections.
  mllp_daemon:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m departments.hl7.mllp_daemon
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
      SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER:-hospital}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hospital_core}
      MLLP_HOST: "0.0.0.0"
      MLLP_PORT: "2576"          # 2576 avoids conflict with Mirth on 2575
      HL7_INGEST_URL: "http://flask:5000/api/hl7/oru"
      HL7_INGEST_API_KEY: ${HL7_INGEST_API_KEY:-changeme}
    ports:
      - "2576:2576"
    depends_on:
      postgres:
        condition: service_healthy
      flask:
        condition: service_started

volumes:

  postgres_data:
  redis_data:
  uploads:
  flask_session:
  backups:
  mirth_data:
