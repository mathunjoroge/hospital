services:

  # ── Caddy Reverse Proxy & TLS Termination (R-08) ──────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - flask

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hospital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-hospital_core}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospital}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Flask HMIS app ───────────────────────────────────────────────────────────
  flask:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
      SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER:-hospital}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hospital_core}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    expose:
      - "5000"
    volumes:
      - uploads:/app/Uploads
      - flask_session:/app/flask_session
      - backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── FastAPI NLP service ──────────────────────────────────────────────────────
  nlp:
    build:
      context: .
      dockerfile: Dockerfile.nlp
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Celery Task Worker ───────────────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A celery_app.celery worker --loglevel=info
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
      SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER:-hospital}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hospital_core}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Mirth Connect — HL7v2 MLLP Interface Engine (Phase 4) ───────────────────
  mirth_connect:
    image: nextgenhealthcare/connect:4.4.2
    restart: unless-stopped
    environment:
      DATABASE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hospital_core}
      DATABASE_USERNAME: ${POSTGRES_USER:-hospital}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      KEYSTORE_STOREPASS: ${MIRTH_KEYSTORE_PASS:?MIRTH_KEYSTORE_PASS must be set}
      KEYSTORE_KEYPASS: ${MIRTH_KEYSTORE_PASS:?MIRTH_KEYSTORE_PASS must be set}
    expose:
      - "8080"
    ports:
      - "2575:2575"    # MLLP receiver port (standard)
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mirth_data:/opt/connect/appdata
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/server/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── MLLP Daemon — asyncio fallback listener (Phase 4) ────────────────────────
  mllp_daemon:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m departments.hl7.mllp_daemon
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
      SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER:-hospital}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hospital_core}
      MLLP_HOST: "0.0.0.0"
      MLLP_PORT: "2576"
      HL7_INGEST_URL: "http://flask:5000/api/hl7/oru"
      HL7_INGEST_API_KEY: ${HL7_INGEST_API_KEY:?HL7_INGEST_API_KEY must be set}
    ports:
      - "2576:2576"
    depends_on:
      postgres:
        condition: service_healthy
      flask:
        condition: service_started

  # ── PostgreSQL hot-standby read replica ─────────────────────────────────────
  postgres_replica:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hospital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-hospital_core}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:?POSTGRES_REPLICATION_USER must be set}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?POSTGRES_REPLICATION_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data
    command: >
      postgres
      -c hot_standby=on
      -c primary_conninfo='host=postgres port=5432 user=${POSTGRES_REPLICATION_USER} password=${POSTGRES_REPLICATION_PASSWORD} application_name=hmis_replica'
      -c primary_slot_name=hmis_wal_receiver
      -c recovery_target_timeline=latest
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dr

  # ── Orthanc PACS (Phase 5) ──────────────────────────────────────────────────
  orthanc:
    image: orthancteam/orthanc:24.4.0
    restart: unless-stopped
    environment:
      ORTHANC__NAME: "HMIS-PACS"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"${ORTHANC_USER:?ORTHANC_USER must be set}":"${ORTHANC_PASSWORD:?ORTHANC_PASSWORD must be set}"}'
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__STORAGE_DIRECTORY: "/var/lib/orthanc/db"
    expose:
      - "8042"
    ports:
      - "4242:4242"    # DICOM C-STORE / C-FIND / C-MOVE
    volumes:
      - orthanc_data:/var/lib/orthanc/db
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8042/system || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5


volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  uploads:
  flask_session:
  backups:
  mirth_data:
  orthanc_data:
  postgres_replica_data:
