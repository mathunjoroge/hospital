name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, hardening/phase-0]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-test-secret-key-not-for-production
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SQLALCHEMY_DATABASE_URI: sqlite:///test.db

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check . --select E,F,W,I --ignore E501

      - name: Security scan (bandit)
        run: bandit -r . -x ./venv,./tests,./migrations --severity-level medium -q

      - name: Dependency audit (enforced gate)
        # Explicitly ignore audited transitive/pinned package advisories:
        # - PYSEC-2026-1350: eventlet async server (prod uses gunicorn)
        # - PYSEC-2026-2151: flask session handling
        # - PYSEC-2026-196, 1795, 1796, 2875, 2876, 3721: build-time pip package manager
        # - PYSEC-2026-1835, 2022-42969: PyPDF2 legacy parser
        # - PYSEC-2026-1845: pytest dev runner
        # - PYSEC-2026-2270: python-dotenv env parser
        # - PYSEC-2026-2045, 2046, 2044, 2320, 3417: werkzeug WSGI utilities
        run: >-
          pip-audit
          --ignore-vuln PYSEC-2026-1350
          --ignore-vuln PYSEC-2026-2151
          --ignore-vuln PYSEC-2026-196
          --ignore-vuln PYSEC-2026-1795
          --ignore-vuln PYSEC-2026-1796
          --ignore-vuln PYSEC-2026-2875
          --ignore-vuln PYSEC-2026-2876
          --ignore-vuln PYSEC-2026-3721
          --ignore-vuln PYSEC-2026-1835
          --ignore-vuln PYSEC-2022-42969
          --ignore-vuln PYSEC-2026-1845
          --ignore-vuln PYSEC-2026-2270
          --ignore-vuln PYSEC-2026-2045
          --ignore-vuln PYSEC-2026-2046
          --ignore-vuln PYSEC-2026-2044
          --ignore-vuln PYSEC-2026-2320
          --ignore-vuln PYSEC-2026-3417

      - name: Run tests with coverage and JUnit XML report
        run: |
          pytest --cov=departments --cov=app --cov-report=term-missing --cov-fail-under=45 --junitxml=test-results.xml -v

      - name: Enforce test failure count and test count baseline CI gate
        if: always()
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          import sys

          try:
              tree = ET.parse('test-results.xml')
              root = tree.getroot()
              tests = int(root.attrib.get('tests', 0))
              failures = int(root.attrib.get('failures', 0))
              errors = int(root.attrib.get('errors', 0))
              skipped = int(root.attrib.get('skipped', 0))

              print(f'Test Suite Metrics: Total={tests}, Failures={failures}, Errors={errors}, Skipped={skipped}')

              if failures > 0 or errors > 0:
                  print(f'::error::CI GATE FAILED: {failures} test failures and {errors} test errors detected!')
                  sys.exit(1)

              MIN_TEST_COUNT = 700
              if tests < MIN_TEST_COUNT:
                  print(f'::error::CI GATE FAILED: Test suite count regression! Expected >= {MIN_TEST_COUNT} tests, but found {tests}.')
                  sys.exit(1)

              print('CI GATE PASSED: Zero test failures/errors and test count baseline met.')
          except Exception as e:
              print(f'::error::Failed to parse test-results.xml: {e}')
              sys.exit(1)
          "

      - name: Upload test & coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            .coverage
            test-results.xml
