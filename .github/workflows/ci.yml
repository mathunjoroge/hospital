name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, hardening/phase-0]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hospital_test
          POSTGRES_PASSWORD: hospital_test_password
          POSTGRES_DB: hospital_test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hospital_test -d hospital_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_SECRET_KEY: ci-test-jwt-secret-key-not-for-production
      ENCRYPTION_KEY: ci-test-encryption-key-not-for-prod
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SQLALCHEMY_DATABASE_URI: sqlite:///test.db

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check . --select E,F,W,I --ignore E501

      - name: Security scan (bandit)
        run: bandit -r . -x ./venv,./tests,./migrations --severity-level medium -q

      - name: Dependency audit (enforced gate)
        run: pip-audit

      - name: Run tests with coverage and JUnit XML report
        run: |
          pytest --cov=departments --cov=app --cov-report=term-missing --cov-fail-under=45 --junitxml=test-results.xml -v

      - name: Enforce test failure count and test count baseline CI gate
        if: always()
        run: |
          python -c "
          import os
          import sys
          import xml.etree.ElementTree as ET

          if not os.path.exists('test-results.xml'):
              print('::warning::test-results.xml not found. Pytest step may have been skipped or failed prior to XML generation.')
              sys.exit(0)

          try:
              tree = ET.parse('test-results.xml')
              root = tree.getroot()
              suites = root.findall('.//testsuite') or [root]
              tests = sum(int(s.attrib.get('tests', 0)) for s in suites)
              failures = sum(int(s.attrib.get('failures', 0)) for s in suites)
              errors = sum(int(s.attrib.get('errors', 0)) for s in suites)
              skipped = sum(int(s.attrib.get('skipped', 0)) for s in suites)

              print(f'Test Suite Metrics: Total={tests}, Failures={failures}, Errors={errors}, Skipped={skipped}')

              if failures > 0 or errors > 0:
                  print(f'::error::CI GATE FAILED: {failures} test failures and {errors} test errors detected!')
                  sys.exit(1)

              MIN_TEST_COUNT = 1295
              if tests < MIN_TEST_COUNT:
                  print(f'::error::CI GATE FAILED: Test suite count regression! Expected >= {MIN_TEST_COUNT} tests, but found {tests}.')
                  sys.exit(1)

              print('CI GATE PASSED: Zero test failures/errors and test count baseline met.')
          except Exception as e:
              print(f'::error::Failed to parse test-results.xml: {e}')
              sys.exit(1)
          "

      - name: Upload test & coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            .coverage
            test-results.xml
