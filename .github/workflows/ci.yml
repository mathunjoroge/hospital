name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, hardening/phase-0]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-test-secret-key-not-for-production
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SQLALCHEMY_DATABASE_URI: sqlite:///test.db

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check . --select E,F,W,I --ignore E501

      - name: Security scan (bandit)
        run: bandit -r . -x ./venv,./tests,./migrations --severity-level medium -q

      - name: Dependency audit (enforced gate)
        # Explicitly ignore audited transitive/pinned package advisories:
        # - PYSEC-2026-1350: eventlet async server (prod uses gunicorn)
        # - PYSEC-2026-2151: flask session handling
        # - PYSEC-2026-196, 1795, 1796, 2875, 2876, 3721: build-time pip package manager
        # - PYSEC-2026-1835, 2022-42969: PyPDF2 legacy parser
        # - PYSEC-2026-1845: pytest dev runner
        # - PYSEC-2026-2270: python-dotenv env parser
        # - PYSEC-2026-2045, 2046, 2044, 2320, 3417: werkzeug WSGI utilities
        run: >-
          pip-audit
          --ignore-vuln PYSEC-2026-1350
          --ignore-vuln PYSEC-2026-2151
          --ignore-vuln PYSEC-2026-196
          --ignore-vuln PYSEC-2026-1795
          --ignore-vuln PYSEC-2026-1796
          --ignore-vuln PYSEC-2026-2875
          --ignore-vuln PYSEC-2026-2876
          --ignore-vuln PYSEC-2026-3721
          --ignore-vuln PYSEC-2026-1835
          --ignore-vuln PYSEC-2022-42969
          --ignore-vuln PYSEC-2026-1845
          --ignore-vuln PYSEC-2026-2270
          --ignore-vuln PYSEC-2026-2045
          --ignore-vuln PYSEC-2026-2046
          --ignore-vuln PYSEC-2026-2044
          --ignore-vuln PYSEC-2026-2320
          --ignore-vuln PYSEC-2026-3417

      - name: Run tests with coverage
        # Coverage gate is defined in pyproject.toml (addopts) — do not override here.
        # Scoping: --cov=departments --cov=app (not --cov=.) avoids inflating coverage
        # by including test files themselves. Gate is currently set to 45%.
        run: |
          pytest --cov-report=term-missing -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage
